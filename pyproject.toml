[project]
name = "dutchbook"
version = "0.1.0"
description = "A coherence benchmark for LLM forecasters: ask for related probabilities in separate conversations, then price a Dutch book against the answers."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Paul Davis" }]
requires-python = ">=3.11"
keywords = ["llm", "benchmark", "forecasting", "probability", "coherence", "dutch-book", "evals"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "scipy>=1.13",
]

[project.scripts]
dutchbook = "dutchbook.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "scipy-stubs>=1.14",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dutchbook"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "RUF", "C4", "PT", "RET", "TID", "PL",
]
ignore = [
    "PLR0911", # too many return statements: parser dispatch reads better flat
    "PLR0912", # too many branches: same
    "PLR0913", # too many arguments: constructors take keyword config
    "PLR2004", # magic values in comparisons are fine in tests and tolerances
    "PLR0915", # too many statements: the analysis passes are one flat loop each
    "PLR0917", # too many positional arguments: chart helpers take one per input
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLC0415"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["matplotlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=dutchbook --cov-report=term-missing"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["dutchbook"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
